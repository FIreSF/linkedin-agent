[project]
name = "lk-linkedin-agent"
version = "1.0.0"
description = "Local, draft-first LinkedIn writing agent"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.scripts]
lk = "lk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lk"]
